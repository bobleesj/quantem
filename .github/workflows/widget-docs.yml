# Build the quantem.widget Jupyter Book and publish it to GitHub Pages on the
# bobleesj fork. The runner is CPU-only and never executes the notebooks: they
# are pre-baked with GPU outputs + widget state and committed, so the offline
# widgets stay interactive in the published static HTML.
name: widget docs

on:
  push:
    branches: [widget-show3d-show4dstem-kernels]
    paths:
      - "widget/docs/**"
      - ".github/workflows/widget-docs.yml"
  workflow_dispatch:

# Origin-only: never deploy Pages from the upstream electronmicroscopy repo even
# if this branch ever lands there.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: widget-docs-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'bobleesj/quantem'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
      - run: pip install -r widget/docs/requirements.txt
      - run: jupyter-book build widget/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: widget/docs/_build/html

  deploy:
    if: github.repository == 'bobleesj/quantem'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
